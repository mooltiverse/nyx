    //  dependencies
    // Configurations can extend other configurations from within the same
    // project by means of 'extendsFrom'.
    // To add artifacts to configurations use the 'artifacts' section.
  }

  dependencies {
    // Here we define the static dependencies on other projects' configurations.
  }

  /*----------------------------------------------------------------------------
    Additional properties
  ----------------------------------------------------------------------------*/

  /*----------------------------------------------------------------------------
    Additional tasks
  ----------------------------------------------------------------------------*/
  // This is a lifecycle task that will depend on concrete test tasks defined
  // by each sub-project. These tests must not require AI agent tokens.
  task unitTest(group: 'verification', description: 'Runs the unit tests for the AI agent extensions') {
  }

  // This is a lifecycle task that will depend on concrete test tasks defined
  // by each sub-project. These tests must not require AI agent tokens.
  task integrationTest(group: 'verification', description: 'Runs the integration tests for the AI agent extensions') {
    // When they are all in the execution plan, run faster tests first.
    mustRunAfter unitTest
  }

  // This is a lifecycle task that will depend on concrete test tasks defined
  // by each sub-project. These tests must not require AI agent tokens.
  task functionalTest(group: 'verification', description: 'Runs the functional tests for the AI agent extensions') {
    // When they are all in the execution plan, run faster tests first.
    mustRunAfter unitTest
    mustRunAfter integrationTest
  }

  // This is a lifecycle task that will depend on other specific test tasks.
  task test(group: 'verification', description: 'Runs all the tests for the AI agent extensions') {
    dependsOn unitTest
    dependsOn integrationTest
    dependsOn functionalTest
    dependsOn subprojects*.test
  }

  task deepClean(group: 'build', description: 'Clean the reproducible and reusable artifacts including caches, dependencies etc') {
    dependsOn clean
    dependsOn subprojects*.deepClean
  }

  /*----------------------------------------------------------------------------
    Additional task dependencies
    ----------------------------------------------------------------------------*/
  //tasks.assemble.dependsOn package
  //tasks.build.dependsOn documentation
  tasks.check.dependsOn test
  
