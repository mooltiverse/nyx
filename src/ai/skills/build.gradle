  }
}

/*------------------------------------------------------------------------------
  Additional tasks
------------------------------------------------------------------------------*/
// This is just a lifecycle task.
// TODO: these tests are missing for now, and should be run with external tools
// rather than implemented in this script:
// - unit: tests of the validation itself (that validateSkills and checkTestData
//   fail on invalid skills and test data)
// - unit: skill names must be unique across the skills here and those bundled
//   in plugins (src/ai/plugins/*/skills/)
// - unit: checks that need to parse the SKILL.md YAML frontmatter beyond what
//   'gh skill publish --dry-run' checks (i.e. the Toolbox metadata)
// - integration and functional: installing and updating the skills with the
//   supported agents (Claude Code, Codex CLI, GitHub Copilot, Gemini CLI)
task unitTest(group: 'verification', description: 'Runs the unit tests for the AI agent extensions') {
  dependsOn checkTestData, validateSkills
  dependsOn subprojects*.unitTest
}

// This is just a lifecycle task
task integrationTest(group: 'verification', description: 'Runs the integration tests for the AI agent extensions') {
  dependsOn subprojects*.integrationTest
}

// This is just a lifecycle task
task functionalTest(group: 'verification', description: 'Runs the functional tests for the AI agent extensions') {
  dependsOn subprojects*.functionalTest
}

// This is just a lifecycle task
task test(group: 'verification', description: 'Runs all the tests for the AI agent extensions') {
  dependsOn unitTest
  dependsOn integrationTest
  dependsOn functionalTest
  dependsOn subprojects*.test
}

task deepClean(group: 'build', description: 'Clean the reproducible and reusable artifacts including caches, dependencies etc') {
  dependsOn clean
  dependsOn subprojects*.deepClean
}

/*------------------------------------------------------------------------------
